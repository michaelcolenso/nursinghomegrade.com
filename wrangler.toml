name = "nursinghomegrade"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "nursinghomegrade"
database_id = "57cfa03c-1808-48e7-a2d4-ea8691565af8"

# KV holds only the sitemap (written offline by scripts/sitemap.ts).
# Rendered pages are cached via the Cache API — see src/cache.ts.
[[kv_namespaces]]
binding = "CACHE"
id = "fa0faa67ae0c434093a3aeaa14a5992e"
preview_id = "0b453a4b546847e78b7249faac04dd26"

# Cloudflare AI Search instance "soft-sun-41cf" (namespace "default"). Called
# server-side from /ask — see src/handlers/ask.ts. Deliberately not exposed
# as a public endpoint on this domain: its default paths (/search,
# /chat/completions, /mcp) collide with routes this Worker already owns.
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "soft-sun-41cf"
remote = true
