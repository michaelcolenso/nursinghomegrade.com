name: Grade display branch patch

on:
  push:
    branches: [grade2/phase-a-missingness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grade2/phase-a-missingness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-grade-display.mjs
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/facility.ts
          git commit -m "Render partial and withheld grades explicitly"
          git push origin HEAD:grade2/phase-a-missingness
