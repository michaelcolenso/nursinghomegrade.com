name: NR display surface patch

on:
  push:
    branches: [grade2/phase-a-missingness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grade2/phase-a-missingness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-nr-surfaces.mjs
      - name: Commit source changes and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render ungraded facilities safely across discovery surfaces"
          git push origin HEAD:grade2/phase-a-missingness
