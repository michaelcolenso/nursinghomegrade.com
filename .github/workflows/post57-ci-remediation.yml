name: Post-57 CI remediation

on:
  push:
    branches:
      - fix/post-57-ci-remediation
    paths:
      - scripts/post57-ci-remediation.mjs
      - .github/workflows/post57-ci-remediation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-57-ci-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/post57-ci-remediation.mjs
      - name: Commit remediation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/post57-ci-remediation.mjs .github/workflows/post57-ci-remediation.yml
          git add src/templates/home.ts test/scoring.test.ts test/grade-penalties.test.ts test/ingest.test.ts test/state.handler.test.ts scripts/stats-sql.ts
          git commit -m "Repair post-57 CI and explicit inspection fixtures"
          git push origin HEAD:fix/post-57-ci-remediation
