name: CI

on:
  pull_request:
  push:
    branches: [primary]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Internal-link coverage (spec 3.4). Needs D1 credentials, so it only runs
  # where they are configured; it is skipped rather than failing the build when
  # the token is absent (forks, for example).
  link-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check orphaned facility pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --max reflects the measured residue rather than an aspiration, so the
        # check fails on regression instead of being permanently red.
        run: npx tsx scripts/check-orphans.ts --remote --max 40
